<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <script>
        let count = 0;

        function increment() {
            count++;
            document.getElementById("count").innerText = count;
        }

        function decrement() {
            count--;
            document.getElementById("count").innerText = count;
        }
     
    </script>
</head>
<body>
    <h1 id="count">0</h1>
    <button onclick="increment()">+</button>
    <button onclick="decrement()">-</button>
</body>
</html>
